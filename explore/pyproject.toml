[project]
name = "explore-features"
version = "0.1.0"
description = "MVP stats over kernel-playground feature Parquet matrices."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
]

[project.scripts]
explore-features = "explore_features:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
